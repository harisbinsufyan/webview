<html>
    <head>
        <meta content="text/html; charset=utf-8" http-equiv="content-type">
        <title>
            JS calls Java
        </title>
    </head>
    
    <body>

        <p>
            <xmp id="show">
            </xmp>
        </p>

        <p>
            <xmp id="init"></xmp>
        </p>

        <p>
            <input type="text" id="text1" value="Username" />
        </p>

        <p>
           <input type="text" id="text2" value="Password" />
        </p>

        <p>
            <input type="button" id="enter" value="Send message to Native" onclick="testClick();"/>
        </p>

        <p>
          <input type="button" id="enter1" value="Call Native method" onclick="testClick1();"/>
        </p>

        <p>
            <input type="button" id="enter2" value="Show HTML" onclick="testDiv();" />
        </p>

        <p>
            <input type="file" value="Open file" />
        </p>

    </body>
    <script>

        function testDiv() {
            document.getElementById("show").innerHTML = document.getElementsByTagName("html")[0].innerHTML;
        }

        function testClick() {
            var str1 = document.getElementById("text1").value;
            var str2 = document.getElementById("text2").value;

            // Send message to native
            var data = {id: 1, content: "This is an image <img src=\"a.png\"/> test\r\nhahaha"};
            window.WebViewJavascriptBridge.send(
                data
                , function(responseData) {
                    document.getElementById("show").innerHTML = "Response data from Java, data = " + responseData
                }
            );

        }

        function testClick1() {
            var str1 = document.getElementById("text1").value;
            var str2 = document.getElementById("text2").value;

            // Call native method
            window.WebViewJavascriptBridge.callHandler(
                'submitFromWeb'
                , {'param': 'Chinese test'}
                , function(responseData) {
                    document.getElementById("show").innerHTML = "Send get response data from Java, data = " + responseData
                }
            );
        }

        function bridgeLog(logContent) {
            document.getElementById("show").innerHTML = logContent;
        }

        function connectWebViewJavascriptBridge(callback) {
            if (window.WebViewJavascriptBridge) {
                callback(WebViewJavascriptBridge)
            } else {
                document.addEventListener(
                    'WebViewJavascriptBridgeReady'
                    , function() {
                        callback(WebViewJavascriptBridge)
                    },
                    false
                );
            }
        }

        connectWebViewJavascriptBridge(function(bridge) {
            bridge.init(function(message, responseCallback) {
                console.log('Js got a message', message);
                var data = {
                    'Javascript Responds': 'Test Chinese!'
                };
                console.log('Js responding with', data);
                responseCallback(data);
            });

            bridge.registerHandler("functionInJs", function(data, responseCallback) {
                document.getElementById("show").innerHTML = ("Data from Java: = " + data);
                var responseData = "Javascript says right back!";
                responseCallback(responseData);
            });
        })
    </script>

</html>
