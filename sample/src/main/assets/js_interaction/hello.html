<head>

    <link rel="stylesheet" type="text/css" href="./button.css">
    <script type="text/javascript">

  function sendHelloToAndroid() {
      // body...
      //console.log("call android")
      if(window.android!=null&&typeof(window.android)!="undefined"){
        window.android.callAndroid("Hello, Android!");
      }else{
         alert(typeof(window.android));
      }
     
  }

  function callByAndroid(){
      console.log("callByAndroid")
      alert("JS received message");
      showElement("JS received message-->No parameter method callByAndroid was called");
  }

  function callByAndroidParam(msg1){
     console.log("callByAndroid_param")
    alert("JS received message: "+msg1);
    showElement("JS received message-->Method callByAndroidParam was called, parameter: "+msg1);

  }
  function callByAndroidMoreParams(objs,msg2,msg3){
     
     alert("JS received message: "+"id:"+objs.id.toString()+" name:"+objs.name+" age:"+objs.age.toString()+msg2+msg3);
    showElement("JS received message-->Method callByAndroidMoreParam was called, parameter1: "+objs+"  parameter2: "+msg2+"  parameter3: "+msg3);
     return "ok";
  }

  function callByAndroidInteraction(msg){

    showElement(msg)

    window.setTimeout(sendHelloToAndroid,1000);

  }


  function showElement(msg){
      var div   =document.getElementById("div_box");  // Get div
      var ele=document.createElement('h6');    // Create h2 element node
      ele.innerHTML=msg;                // Set h2 node content
      div.appendChild(ele);                    // Add child node ele


}


    </script>
</head>
<body style="width: 100%;height: 100%;padding: 0px">

<div id="div_box"
     style="width: 100%;min-height: 100%;position: absolute;background: #0ff;margin-top: -50px;margin: 0px">


</div>
